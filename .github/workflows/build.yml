name: Build Textural VST3 (Windows)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Configure (binaire universel Intel + Apple Silicon)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Signature locale (ad-hoc) et nettoyage
        run: |
          VST3=$(find build -type d -name "*.vst3" | head -n 1)
          echo "Plugin trouvé : $VST3"
          xattr -cr "$VST3"
          codesign --force --deep --sign - "$VST3"
          codesign --verify --deep --strict "$VST3"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$VST3" "dist/$(basename "$VST3" .vst3)-macOS.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: VST3-macOS
          path: dist/*.zip
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure (CMake + Visual Studio 2022, x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Collect VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse -Force "build/Textural_artefacts/Release/VST3/Textural.vst3" "dist/Textural.vst3"
          Get-ChildItem -Recurse dist | Select-Object FullName

      - name: Build installer (Inno Setup)
        shell: pwsh
        continue-on-error: true
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Textural-VST3-Windows
          path: dist/Textural.vst3

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Textural-Setup-Windows
          path: dist/Textural-Setup.exe
          if-no-files-found: warn
